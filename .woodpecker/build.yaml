steps:
  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx:6
    settings:
      registry: docker.io
      repo: alejoide/curriculum-vitae

      username:
        from_secret: dockerhub_username
      password:
        from_secret: dockerhub_token

      tags:
        - latest
        - ${CI_COMMIT_TAG}

      dockerfile: Dockerfile
      platforms: linux/amd64

      buildkit_debug: true
      buildkit_oci_max_parallelism: 2

when:
  event:
    - tag
  branch:
    - main
